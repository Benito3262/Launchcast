name: Deploy LaunchCast V2 live rounds to Robinhood Testnet

on:
  workflow_dispatch:
    inputs:
      confirm_testnet_deployment:
        description: "Confirm a LaunchcastRounds deployment to Robinhood Chain Testnet (chain ID 46630)"
        required: true
        type: choice
        options:
          - "no"
          - "yes"

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ inputs.confirm_testnet_deployment == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RPC_URL: https://rpc.testnet.chain.robinhood.com
      STAKE_TOKEN_ADDRESS: "0x9557aade5c89fe39941b4f3a60cbac16e3f32143"
      VIBE_V6_FACTORY: "0xac135da186de8325047ef2afd1d16d5971f731f7"
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Check testnet
        env:
          PRIVATE_KEY: ${{ secrets.LAUNCHCAST_TESTNET_PRIVATE_KEY }}
        run: |
          test -n "$PRIVATE_KEY" || (echo "Missing LAUNCHCAST_TESTNET_PRIVATE_KEY secret." && exit 1)
          test "$(cast chain-id --rpc-url "$RPC_URL")" = "46630" || (echo "Refusing: wrong chain." && exit 1)
          echo "Deployer: $(cast wallet address --private-key "$PRIVATE_KEY")"
      - name: Build and test
        run: |
          forge build
          forge test
      - name: Deploy
        env:
          PRIVATE_KEY: ${{ secrets.LAUNCHCAST_TESTNET_PRIVATE_KEY }}
        run: |
          forge script script/DeployRounds.s.sol:DeployLaunchcastRounds --rpc-url "$RPC_URL" --broadcast
          FILE="broadcast/DeployRounds.s.sol/46630/run-latest.json"
          ADDRESS="$(jq -r '[.transactions[] | select(.transactionType == "CREATE" and .contractName == "LaunchcastRounds") | .contractAddress] | last // empty' "$FILE")"
          [[ "$ADDRESS" =~ ^0x[a-fA-F0-9]{40}$ ]] || (echo "No address found." && exit 1)
          echo "LaunchcastRounds deployed: $ADDRESS"
          echo "## LaunchcastRounds deployed: \`$ADDRESS\`" >> "$GITHUB_STEP_SUMMARY"
