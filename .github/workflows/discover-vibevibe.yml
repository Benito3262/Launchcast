name: Refresh VibeVibe token registry

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/discovery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore discovery checkpoint
        uses: actions/cache@v4
        with:
          path: services/discovery/data/checkpoint.json
          key: vibevibe-discovery-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            vibevibe-discovery-${{ runner.os }}-${{ github.ref_name }}-
      - run: npm install
      - run: npm run discover
      - name: Commit updated token registry
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/vibevibe-tokens.json
          if git diff --cached --quiet; then
            echo "Token registry is unchanged."
          else
            git commit -m "Refresh VibeVibe token discovery registry"
            git push
          fi
