name: Deploy Launchcast to Robinhood Testnet

on:
  workflow_dispatch:
    inputs:
      confirm_testnet_deployment:
        description: "Explicitly confirm deployment to Robinhood Chain Testnet (chain ID 46630)"
        required: true
        type: choice
        options:
          - "no"
          - "yes"

permissions:
  contents: write

jobs:
  deploy:
    if: ${{ inputs.confirm_testnet_deployment == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Verify testnet and deployment secrets
        env:
          RPC_URL: https://rpc.testnet.chain.robinhood.com
          PRIVATE_KEY: ${{ secrets.LAUNCHCAST_TESTNET_PRIVATE_KEY }}
          FEE_RECIPIENT: ${{ secrets.LAUNCHCAST_FEE_RECIPIENT }}
        run: |
          test -n "$PRIVATE_KEY" || (echo "Missing LAUNCHCAST_TESTNET_PRIVATE_KEY repository secret." && exit 1)
          test -n "$FEE_RECIPIENT" || (echo "Missing LAUNCHCAST_FEE_RECIPIENT repository secret." && exit 1)
          [[ "$FEE_RECIPIENT" =~ ^0x[a-fA-F0-9]{40}$ ]] || (echo "FEE_RECIPIENT must be a valid EVM address." && exit 1)
          test "${FEE_RECIPIENT,,}" != "0x0000000000000000000000000000000000000000" || (echo "FEE_RECIPIENT cannot be the zero address." && exit 1)
          DEPLOYER="$(cast wallet address --private-key "$PRIVATE_KEY")"
          BALANCE="$(cast balance "$DEPLOYER" --rpc-url "$RPC_URL")"
          echo "Deployer: $DEPLOYER"
          echo "Testnet ETH balance (wei): $BALANCE"
          test "$BALANCE" != "0" || (echo "Deployer has no testnet ETH for gas." && exit 1)
          CHAIN_ID="$(cast chain-id --rpc-url "$RPC_URL")"
          echo "Connected chain ID: $CHAIN_ID"
          test "$CHAIN_ID" = "46630" || (echo "Refusing to deploy: RPC is not Robinhood Chain Testnet." && exit 1)

      - name: Run contract test suite
        run: forge test

      - name: Deploy TestUSD and Launchcast
        env:
          PRIVATE_KEY: ${{ secrets.LAUNCHCAST_TESTNET_PRIVATE_KEY }}
          FEE_RECIPIENT: ${{ secrets.LAUNCHCAST_FEE_RECIPIENT }}
          RPC_URL: https://rpc.testnet.chain.robinhood.com
        run: forge script script/Deploy.s.sol:DeployLaunchcast --rpc-url "$RPC_URL" --broadcast --slow

      - name: Summarize deployed contract addresses
        if: success()
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'broadcast/Deploy.s.sol/46630/run-latest.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          const txs = data.transactions || [];
          const deployments = txs.filter(tx => tx.transactionType === 'CREATE' && tx.contractAddress);
          const launchcast = deployments.find(tx => tx.contractName === 'Launchcast');
          const testUSD = deployments.find(tx => tx.contractName === 'TestUSD');
          if (!launchcast || !testUSD) throw new Error('Could not identify both Launchcast and TestUSD deployment addresses.');
          const config = {
            schemaVersion: 1,
            chainId: 46630,
            launchcastAddress: launchcast.contractAddress,
            stakeTokenAddress: testUSD.contractAddress,
            deployedAt: new Date().toISOString()
          };
          fs.writeFileSync('web/public/data/deployment.json', JSON.stringify(config, null, 2) + '\\n');
          const lines = [
            '## Launchcast testnet deployment',
            '',
            'Network: Robinhood Chain Testnet (46630)',
            '',
            '| Contract | Address |',
            '|---|---|',
            `| Launchcast | \`${config.launchcastAddress}\` |`,
            `| TestUSD | \`${config.stakeTokenAddress}\` |`,
            '',
            'The public deployment config has been written to web/public/data/deployment.json. Never share your private key.'
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\\n') + '\\n');
          NODE

      - name: Publish public deployment addresses
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/deployment.json
          git commit -m "Publish Robinhood testnet deployment addresses"
          git push

      - name: Upload deployment record
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: launchcast-testnet-deployment
          path: broadcast/Deploy.s.sol/46630/run-latest.json
          if-no-files-found: error
          retention-days: 30
