name: Deploy Launchcast V2 to Robinhood Testnet

on:
  workflow_dispatch:
    inputs:
      confirm_testnet_deployment:
        description: "Explicitly confirm a separate V2 deployment to Robinhood Chain Testnet (chain ID 46630)"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
      github_environment:
        description: "Exact name of the GitHub Actions environment containing the deployment private key"
        required: true
        type: string
      resolver_1:
        description: "Public EOA address for resolver 1 (must have independently controlled signing key)"
        required: true
        type: string
      resolver_2:
        description: "Public EOA address for resolver 2 (must have independently controlled signing key)"
        required: true
        type: string
      resolver_3:
        description: "Public EOA address for resolver 3 (must have independently controlled signing key)"
        required: true
        type: string
      fee_bps:
        description: "V2 fee in basis points (maximum 1000)"
        required: true
        default: "0"
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ inputs.confirm_testnet_deployment == 'yes' }}
    environment:
      name: ${{ inputs.github_environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Verify deployment configuration and testnet
        env:
          RPC_URL: https://rpc.testnet.chain.robinhood.com
          PRIVATE_KEY: ${{ secrets.LAUNCHCAST_TESTNET_PRIVATE_KEY || secrets.PRIVATE_KEY }}
          STAKE_TOKEN_ADDRESS: "0x9557aade5c89fe39941b4f3a60cbac16e3f32143"
          FEE_RECIPIENT: "0x54032f2d6adc9b327f5f2222d5ae1d6346a2cb14"
          RESOLVER_1: ${{ inputs.resolver_1 }}
          RESOLVER_2: ${{ inputs.resolver_2 }}
          RESOLVER_3: ${{ inputs.resolver_3 }}
          FEE_BPS: ${{ inputs.fee_bps }}
        run: |
          test -n "$PRIVATE_KEY" || (echo "Missing deployment private key. Expected LAUNCHCAST_TESTNET_PRIVATE_KEY or PRIVATE_KEY in the selected GitHub environment." && exit 1)
          for name in RESOLVER_1 RESOLVER_2 RESOLVER_3; do
            value="${!name}"
            [[ "$value" =~ ^0x[a-fA-F0-9]{40}$ ]] || (echo "$name must be a valid EVM address." && exit 1)
            test "${value,,}" != "0x0000000000000000000000000000000000000000" || (echo "$name cannot be zero." && exit 1)
          done
          test "${RESOLVER_1,,}" != "${RESOLVER_2,,}" || (echo "Resolver addresses must be distinct." && exit 1)
          test "${RESOLVER_1,,}" != "${RESOLVER_3,,}" || (echo "Resolver addresses must be distinct." && exit 1)
          test "${RESOLVER_2,,}" != "${RESOLVER_3,,}" || (echo "Resolver addresses must be distinct." && exit 1)
          [[ "$FEE_BPS" =~ ^[0-9]+$ ]] && test "$FEE_BPS" -le 1000 || (echo "FEE_BPS must be an integer from 0 to 1000." && exit 1)
          DEPLOYER="$(cast wallet address --private-key "$PRIVATE_KEY")"
          test "${FEE_RECIPIENT,,}" != "${DEPLOYER,,}" || (echo "Fee recipient cannot be the deployer/contract owner." && exit 1)
          test "${FEE_RECIPIENT,,}" != "${STAKE_TOKEN_ADDRESS,,}" || (echo "Fee recipient cannot be the stake token contract." && exit 1)
          for name in RESOLVER_1 RESOLVER_2 RESOLVER_3; do
            value="${!name}"
            test "${value,,}" != "${DEPLOYER,,}" || (echo "$name cannot be the deployer/contract owner." && exit 1)
            test "${value,,}" != "${FEE_RECIPIENT,,}" || (echo "$name cannot be the fee recipient." && exit 1)
            test "${value,,}" != "${STAKE_TOKEN_ADDRESS,,}" || (echo "$name cannot be the stake token contract." && exit 1)
            RESOLVER_CODE="$(cast code "$value" --rpc-url "$RPC_URL")"
            test "$RESOLVER_CODE" = "0x" || (echo "$name must be an EOA signing address, not a contract wallet." && exit 1)
          done
          BALANCE="$(cast balance "$DEPLOYER" --rpc-url "$RPC_URL")"
          CHAIN_ID="$(cast chain-id --rpc-url "$RPC_URL")"
          echo "Deployer: $DEPLOYER"
          echo "Testnet ETH balance (wei): $BALANCE"
          echo "Connected chain ID: $CHAIN_ID"
          test "$CHAIN_ID" = "46630" || (echo "Refusing deployment: wrong chain." && exit 1)
          test "$BALANCE" != "0" || (echo "Deployer has no testnet ETH for gas." && exit 1)
          CODE="$(cast code "$STAKE_TOKEN_ADDRESS" --rpc-url "$RPC_URL")"
          test "$CODE" != "0x" || (echo "Stake token has no code on testnet." && exit 1)

      - name: Build and test all contracts
        run: |
          forge build
          forge test -vv

      - name: Deploy V2 separately
        id: deploy_v2
        env:
          RPC_URL: https://rpc.testnet.chain.robinhood.com
          PRIVATE_KEY: ${{ secrets.LAUNCHCAST_TESTNET_PRIVATE_KEY || secrets.PRIVATE_KEY }}
          STAKE_TOKEN_ADDRESS: "0x9557aade5c89fe39941b4f3a60cbac16e3f32143"
          FEE_RECIPIENT: "0x54032f2d6adc9b327f5f2222d5ae1d6346a2cb14"
          RESOLVER_1: ${{ inputs.resolver_1 }}
          RESOLVER_2: ${{ inputs.resolver_2 }}
          RESOLVER_3: ${{ inputs.resolver_3 }}
          FEE_BPS: ${{ inputs.fee_bps }}
        run: |
          forge script script/DeployV2.s.sol:DeployLaunchcastV2 --rpc-url "$RPC_URL" --broadcast
          DEPLOYMENT_FILE="broadcast/DeployV2.s.sol/46630/run-latest.json"
          test -f "$DEPLOYMENT_FILE" || (echo "Foundry deployment record was not created." && exit 1)
          ADDRESS="$(jq -r '[.transactions[] | select(.transactionType == "CREATE" and .contractName == "LaunchcastV2") | .contractAddress] | last // empty' "$DEPLOYMENT_FILE")"
          [[ "$ADDRESS" =~ ^0x[a-fA-F0-9]{40}$ ]] || (echo "Could not extract the deployed LaunchcastV2 address." && exit 1)
          echo "contract_address=$ADDRESS" >> "$GITHUB_OUTPUT"
          {
            echo "## Launchcast V2 deployed to Robinhood Testnet"
            echo ""
            echo "- Chain ID: 46630"
            echo "- Contract: `$ADDRESS`"
            echo "- Set this as Vercel environment variable `VITE_LAUNCHCAST_V2_ADDRESS` to activate the V2 tab."
          } >> "$GITHUB_STEP_SUMMARY"
